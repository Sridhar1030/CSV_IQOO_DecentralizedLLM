[project]
name = "llmobs"
version = "0.1.0"
description = "OTLP proxy that enriches LLM spans with device RAM and derives token, latency and error metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    # --- OpenTelemetry (Apache-2.0) : traces + metrics + W3C context propagation
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
    # --- Host / process resource sampling (BSD-3-Clause)
    "psutil>=5.9",
    # --- The proxy endpoint (MIT / BSD-3-Clause)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # --- Forwarding to the upstream Collector (BSD-3-Clause)
    "httpx>=0.27",
]

[project.optional-dependencies]
prometheus = ["opentelemetry-exporter-prometheus>=0.48b0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
llmobs-server = "llmobs.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
